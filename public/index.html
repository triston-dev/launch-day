<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Launch Day · Game Release Calendar</title>
    <meta name="description" content="Every upcoming PC and console game on one calendar, with descriptions, trailers and store links." />
    <meta name="theme-color" content="#0d0e12" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="preconnect" href="https://shared.akamai.steamstatic.com" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="progress" id="progress" hidden>
      <div class="progress-bar"></div>
      <span class="progress-label"></span>
    </div>

    <header class="topbar">
      <a class="brand" href="#view=calendar" aria-label="Launch Day home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1" y="3" width="30" height="27" rx="8" fill="var(--accent)" />
          <rect x="1" y="3" width="30" height="8" rx="4" fill="var(--accent-deep)" />
          <path d="M16 13.5l5.5 9.5h-3.6v3h-3.8v-3h-3.6z" fill="var(--accent-ink)" />
          <rect x="8" y="1" width="3" height="6" rx="1.5" fill="var(--text)" />
          <rect x="21" y="1" width="3" height="6" rx="1.5" fill="var(--text)" />
        </svg>
        <span class="brand-name">Launch Day</span>
      </a>

      <nav class="view-switch" role="tablist" aria-label="View">
        <button role="tab" data-action="view" data-view="calendar">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/></svg>
          <span>Calendar</span>
        </button>
        <button role="tab" data-action="view" data-view="upcoming">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
          <span>Upcoming</span>
        </button>
      </nav>

      <div class="search">
        <svg class="icon search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4.6-4.6"/></svg>
        <input id="search" type="search" placeholder="Search games or studios" autocomplete="off" spellcheck="false" aria-label="Search games" />
        <kbd class="search-kbd">/</kbd>
        <div class="search-results" id="search-results" hidden></div>
      </div>

      <button class="icon-btn" id="theme-toggle" data-action="theme" aria-label="Toggle theme"></button>
    </header>

    <section class="filters" id="filters" aria-label="Filters"></section>

    <main class="main" id="main"></main>

    <footer class="footer" id="footer"></footer>

    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Details"></aside>
    <div class="lightbox" id="lightbox" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
